name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-vet-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4.11@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 1s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed in:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: make vet
      - name: clock check
        run: make clock-check
      - name: build
        run: make build
      - name: test with race detector
        run: make test-race
      - name: differential
        run: REDIS_REF_ADDR=127.0.0.1:6379 go test -count=1 -run 'TestDiff' ./tests/differential/
      - name: fuzz smoke
        run: make fuzz FUZZTIME=20s
